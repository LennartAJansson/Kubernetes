# nginx-konfiguration för CustomerClient (Angular SPA + två proxies).
#
# Filen kopieras till /etc/nginx/templates/default.conf.template i imagen.
# nginx-imagen kör envsubst på mallen när containern startar och ersätter
# ${API_UPSTREAM} och ${FARO_UPSTREAM} med miljövariabler från Helm.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- API-proxy ---------------------------------------------------------
    # /api/customers -> TelemetryApi i klustret. Headern traceparent som
    # Faro lägger på anropet följer med automatiskt - därför hänger
    # webbläsarens span och API:ts span ihop i samma trace.
    location /api/ {
        proxy_pass ${API_UPSTREAM}/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # ---- Faro-proxy ----------------------------------------------------------
    # Webbläsarens telemetri till faro-collectorn i namespace monitoring.
    # Samma origin som appen => ingen CORS, inget certifikat att lita på.
    location /faro/ {
        proxy_pass ${FARO_UPSTREAM}/;
        proxy_http_version 1.1;
        access_log off;
    }

    # ---- Angular -------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
