# =============================================================================
# Ingress för monitoreringsstacken - k3d-home (*.local istället för *.ubk3s)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - grafana.local
  rules:
    - host: grafana.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: telemetry-grafana
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
