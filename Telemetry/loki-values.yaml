deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    allow_structured_metadata: true
    reject_old_samples: true
    reject_old_samples_max_age: 168h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    # RÄTTAD för k3d-home: local-shared-path -> local-path.
    storageClass: "local-path"
    size: 10Gi

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# TILLAGT för k3d-home: chartens memcached-cachar är påslagna som standard och
# chunks-cachen begär ca 8 GB minne (allocatedMemory: 8192) - podden blir
# Pending på en utvecklardator. För en enda Loki-instans behövs de inte.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# TILLAGT: canary (DaemonSet som skriver testloggar) och helm-testpodden
# behövs inte i en kursmiljö och gör bara loggarna stökigare.
lokiCanary:
  enabled: false
test:
  enabled: false

gateway:
  replicas: 1
  # Oförändrad mot k3s-mappen (bugg I): chartens default sätter en HÅRD
  # pod-anti-affinity mellan gateway-repliker, vilket ger permanent dödläge
  # på ett enda-nod-kluster. affinity: "" fungerar INTE (Helm ignorerar tyst
  # en scalar-override av en map, se varningen "cannot overwrite table with
  # non table"). Rätt fix är att nollställa den nästlade nyckeln med null.
  affinity:
    podAntiAffinity: null
