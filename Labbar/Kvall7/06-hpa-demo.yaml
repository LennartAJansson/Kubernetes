# =============================================================================
# Labb 6 - automatisk skalning (HorizontalPodAutoscaler)
#
#   kubectl apply -f 06-hpa-demo.yaml
#   kubectl get hpa -n lab -w            # i ett eget fönster
#
# Generera last (i ett annat fönster, avbryt med Ctrl+C):
#   kubectl run load -n lab --rm -it --image=busybox:1.36 --restart=Never -- `
#     /bin/sh -c "while true; do wget -q -O- http://web >/dev/null; done"
#
# Kräver metrics-server - den följer med k3s/k3d (kubectl top pods fungerar).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          # HPA räknar CPU i procent AV REQUEST - utan requests ingen skalning.
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
