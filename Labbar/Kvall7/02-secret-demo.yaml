# =============================================================================
# Labb 2 - en Pod som använder Secret:en db-credentials, som miljövariabel
# och som fil.
#
# Skapa Secret:en FÖRST (labb 2a):
#   kubectl create secret generic db-credentials -n lab `
#     --from-literal=username=app --from-literal=password='S3cret!'
#
#   kubectl apply -f 02-secret-demo.yaml
#   kubectl logs secret-demo -n lab
#   kubectl exec -n lab secret-demo -- cat /secrets/password
#
# I labb 3 ersätts Secret:en av en SealedSecret - podden märker ingen skillnad.
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
  namespace: lab
spec:
  containers:
    - name: demo
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Som miljövariabel: DB_USER=$DB_USER DB_PASSWORD=$DB_PASSWORD"
          echo "Som filer i /secrets:"; ls -l /secrets/
          sleep 3600
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
      volumeMounts:
        - name: secrets
          mountPath: /secrets
          readOnly: true
  volumes:
    - name: secrets
      secret:
        secretName: db-credentials
