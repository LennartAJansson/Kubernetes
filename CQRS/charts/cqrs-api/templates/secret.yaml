{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cqrs-api.secretName" . }}
  labels:
    {{- include "cqrs-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ .Values.database.connectionString | quote }}
{{- end }}
