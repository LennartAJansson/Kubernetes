apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cqrs-api.fullname" . }}
  labels:
    {{- include "cqrs-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cqrs-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cqrs-api.selectorLabels" . | nindent 8 }}
      annotations:
        # Ändrad connection string i values => ny checksumma => poddarna startas om.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: {{ .Values.containerPort | quote }}
            # --- Läs-sidan (Dapper) ---
            - name: ConnectionStrings__ReadDb
              valueFrom:
                secretKeyRef:
                  name: {{ include "cqrs-api.secretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            # --- Skriv-sidan (NATS JetStream) ---
            - name: Nats__Url
              value: {{ .Values.nats.url | quote }}
            - name: Nats__Stream
              value: {{ .Values.nats.stream | quote }}
            # --- CORS ---
            - name: Cors__Mode
              value: {{ .Values.cors.mode | quote }}
            {{- range $i, $origin := .Values.cors.origins }}
            - name: Cors__Origins__{{ $i }}
              value: {{ $origin | quote }}
            {{- end }}
            - name: OpenApi__Enabled
              value: {{ .Values.openApi.enabled | quote }}
            {{- range $name, $value := .Values.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
