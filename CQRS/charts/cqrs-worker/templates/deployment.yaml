apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cqrs-worker.fullname" . }}
  labels:
    {{- include "cqrs-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate: gamla podden stoppas innan den nya startar, så två versioner
  # av workern aldrig konsumerar kommandon samtidigt under en uppgradering.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cqrs-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cqrs-worker.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ConnectionStrings__WriteDb
              valueFrom:
                secretKeyRef:
                  name: {{ include "cqrs-worker.secretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            - name: Nats__Url
              value: {{ .Values.nats.url | quote }}
            - name: Nats__Stream
              value: {{ .Values.nats.stream | quote }}
            - name: Nats__Consumer
              value: {{ .Values.nats.consumer | quote }}
            {{- if .Values.telemetry.enabled }}
            # --- OpenTelemetry (standardvariabler, läses av SDK:n) ---
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.telemetry.serviceName | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.telemetry.otlpProtocol | quote }}
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: {{ .Values.telemetry.metricExportIntervalMs | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.instance.id=$(K8S_POD_NAME),k8s.pod.name=$(K8S_POD_NAME),k8s.namespace.name=$(K8S_NAMESPACE)"
            {{- end }}
            {{- range $name, $value := .Values.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
