# nginx-konfiguration för CQRSClient (Angular SPA + proxy mot CQRSApi).
#
# Filen kopieras till /etc/nginx/templates/default.conf.template i imagen.
# nginx-imagen kör envsubst på mallen när containern startar och ersätter
# ${API_UPSTREAM} och ${API_KEY} med miljövariabler från Helm (värdena kommer
# från values.yaml / en Secret). Bara variabler som faktiskt finns som
# miljövariabler ersätts - nginx egna $uri m.fl. lämnas orörda.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- API-proxy ---------------------------------------------------------
    # Webbläsaren anropar /api/persons på SAMMA adress som appen laddades från
    # (cqrsclient.local). nginx skickar vidare till CQRSApi inne i klustret
    # och lägger på X-API-KEY. Nyckeln når därmed aldrig webbläsaren, och
    # ingen CORS behövs eftersom allt är samma origin.
    #
    # Avslutande / i proxy_pass tar bort prefixet: /api/persons -> /persons
    location /api/ {
        proxy_pass ${API_UPSTREAM}/;
        proxy_set_header X-API-KEY "${API_KEY}";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # ---- Faro-proxy (kväll 6) ------------------------------------------------
    # Webbläsarens telemetri (Grafana Faro) till faro-collectorn i namespace
    # monitoring. Samma origin som appen => ingen CORS. Headern traceparent
    # som Faro sätter på /api-anropen följer med automatiskt genom proxyn ovan.
    location /faro/ {
        proxy_pass ${FARO_UPSTREAM}/;
        proxy_http_version 1.1;
        access_log off;
    }

    # ---- Angular -------------------------------------------------------------
    # SPA-fallback: okända sökvägar ska leverera index.html så att Angulars
    # router tar hand om dem (t.ex. vid omladdning av en djup länk).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html får aldrig cachas - annars ser användaren gammal version
    # efter en ny deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Byggda filer har hash i namnet (main-AB12CD.js) och kan cachas länge.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Enkel hälsokoll för Kubernetes probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
