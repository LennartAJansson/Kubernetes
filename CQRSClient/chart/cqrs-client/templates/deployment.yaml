apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cqrs-client.fullname" . }}
  labels:
    {{- include "cqrs-client.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cqrs-client.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cqrs-client.selectorLabels" . | nindent 8 }}
      annotations:
        # Ny API-nyckel i values => ny checksumma => poddarna startas om och
        # nginx läser in den nya nyckeln.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            # Fylls i nginx-mallen (${API_UPSTREAM} / ${API_KEY}) när containern startar.
            - name: API_UPSTREAM
              value: {{ .Values.api.upstream | quote }}
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cqrs-client.secretName" . }}
                  key: {{ .Values.api.existingSecretKey }}
            - name: FARO_UPSTREAM
              value: {{ .Values.faro.upstream | quote }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
